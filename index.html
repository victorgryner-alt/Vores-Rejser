<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Wheelie Legends</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

body{
    overflow:hidden;
    background:#05070c;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

canvas{display:block}

/* START MENU */
#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 20%,#14284e 0%,transparent 40%),
        linear-gradient(135deg,#05070c,#090d16);
}

.menuBox{
    width:min(900px,92vw);
    padding:42px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:28px;
    background:rgba(10,14,23,.82);
    backdrop-filter:blur(20px);
    box-shadow:0 30px 100px rgba(0,0,0,.7);
}

.logo{
    font-size:54px;
    font-weight:900;
    letter-spacing:-3px;
}

.logo span{
    color:#4c8dff;
}

.subtitle{
    color:#8793a8;
    margin-top:8px;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:17px;
    background:#111722;
    border:1px solid #293247;
    border-radius:13px;
    color:white;
    font-size:16px;
    outline:none;
    margin-bottom:20px;
}

.bikes{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.bike{
    padding:25px;
    border-radius:18px;
    background:#101620;
    border:2px solid transparent;
    cursor:pointer;
    transition:.2s;
}

.bike:hover{
    transform:translateY(-4px);
    background:#151d2b;
}

.bike.selected{
    border-color:#4c8dff;
    box-shadow:0 0 30px rgba(76,141,255,.2);
}

.bike h2{
    font-size:24px;
}

.bike p{
    color:#7d899c;
    margin-top:7px;
}

.start{
    width:100%;
    border:0;
    margin-top:22px;
    padding:18px;
    border-radius:14px;
    font-size:18px;
    font-weight:800;
    color:white;
    cursor:pointer;
    background:linear-gradient(90deg,#326cff,#6c42ff);
    box-shadow:0 10px 35px rgba(55,103,255,.3);
}

/* HUD */
#hud{
    display:none;
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
}

.top{
    display:flex;
    justify-content:space-between;
    padding:25px;
}

.card{
    background:rgba(6,10,17,.72);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:14px 20px;
}

.label{
    color:#7e8a9f;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.value{
    font-size:25px;
    font-weight:900;
    margin-top:2px;
}

#combo{
    color:#6aa1ff;
}

.speed{
    position:absolute;
    bottom:30px;
    right:30px;
    width:160px;
    height:160px;
    border-radius:50%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(5,9,16,.8);
    border:6px solid #172134;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
}

#speedNumber{
    font-size:46px;
    font-weight:900;
}

.kmh{
    color:#768399;
    font-size:13px;
}

.wheelie{
    position:absolute;
    left:30px;
    bottom:30px;
    width:300px;
}

.bar{
    margin-top:8px;
    height:12px;
    background:#121a28;
    border-radius:20px;
    overflow:hidden;
}

#balanceBar{
    width:0%;
    height:100%;
    border-radius:20px;
    background:linear-gradient(90deg,#3e7cff,#995cff);
}

.controls{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    color:#8490a5;
    background:rgba(5,9,16,.65);
    padding:12px 20px;
    border-radius:12px;
}

.controls b{color:white}

/* CRASH */
#crash{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(8px);
}

.crashBox{
    text-align:center;
}

.crashBox h1{
    font-size:70px;
}

.crashBox p{
    color:#929caf;
    margin:10px;
}

.crashBox button{
    pointer-events:auto;
    margin-top:15px;
    border:0;
    padding:15px 35px;
    border-radius:12px;
    color:white;
    background:#407bff;
    font-weight:bold;
    cursor:pointer;
}

/* LEADERBOARD */
#leaderboard{
    position:absolute;
    right:25px;
    top:105px;
    width:260px;
}

.leaderTitle{
    font-weight:900;
    margin-bottom:10px;
}

.leader{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid rgba(255,255,255,.06);
    font-size:13px;
}

@media(max-width:650px){
    .bikes{grid-template-columns:1fr}
    .logo{font-size:40px}
    #leaderboard{display:none}
    .controls{display:none}
}
</style>
</head>

<body>

<div id="menu">
    <div class="menuBox">
        <div class="logo">WHEELIE <span>LEGENDS</span></div>
        <div class="subtitle">Hold den perfekte wheelie. Slå din highscore.</div>

        <input id="username" placeholder="Dit navn..." maxlength="15">

        <div class="bikes">

            <div class="bike selected" data-bike="talaria">
                <h2>⚡ Talaria XXX</h2>
                <p>Let • Hurtig acceleration • Nem balance</p>
            </div>

            <div class="bike" data-bike="surron">
                <h2>🔥 Surron LBX</h2>
                <p>Power • Høj topfart • Mere aggressiv</p>
            </div>

        </div>

        <button class="start" onclick="startGame()">START RIDE</button>
    </div>
</div>


<div id="hud">

    <div class="top">

        <div class="card">
            <div class="label">Score</div>
            <div class="value" id="score">0</div>
        </div>

        <div class="card">
            <div class="label">Combo</div>
            <div class="value" id="combo">x1.0</div>
        </div>

    </div>


    <div id="leaderboard" class="card">
        <div class="leaderTitle">🏆 LEADERBOARD</div>
        <div id="leaderRows"></div>
    </div>


    <div class="wheelie card">
        <div class="label">Wheelie balance</div>
        <div class="bar">
            <div id="balanceBar"></div>
        </div>
    </div>


    <div class="controls">
        <b>W</b> GAS &nbsp;
        <b>S</b> BRAKE &nbsp;
        <b>A/D</b> STEER &nbsp;
        <b>SPACE</b> WHEELIE
    </div>


    <div class="speed">
        <div id="speedNumber">0</div>
        <div class="kmh">KM/H</div>
    </div>

</div>


<div id="crash">
    <div class="crashBox">
        <h1>CRASH 💀</h1>
        <p id="finalScore"></p>
        <button onclick="resetGame()">RIDE AGAIN</button>
    </div>
</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";


/* ---------------- GAME VARIABLES ---------------- */

let scene;
let camera;
let renderer;

let bike;
let frontWheel;
let rearWheel;

let speed = 0;
let wheelieAngle = 0;
let steering = 0;

let score = 0;
let combo = 1;

let running = false;
let crashed = false;

let selectedBike = "talaria";

const keys = {};

window.gameStart = false;


/* ---------------- MENU ---------------- */

document.querySelectorAll(".bike").forEach(el=>{

    el.onclick=()=>{

        document.querySelectorAll(".bike")
        .forEach(x=>x.classList.remove("selected"));

        el.classList.add("selected");

        selectedBike=el.dataset.bike;
    };

});


window.startGame=function(){

    const username =
    document.getElementById("username").value.trim() || "Rider";

    localStorage.setItem("wheelieUsername",username);

    document.getElementById("menu").style.display="none";
    document.getElementById("hud").style.display="block";

    init();
    running=true;
};


const oldName=localStorage.getItem("wheelieUsername");

if(oldName){
    document.getElementById("username").value=oldName;
}


/* ---------------- THREE JS ---------------- */

function init(){

    scene=new THREE.Scene();

    scene.background=new THREE.Color(0x87b5d9);

    scene.fog=new THREE.Fog(
        0x87b5d9,
        80,
        350
    );


    camera=new THREE.PerspectiveCamera(
        65,
        innerWidth/innerHeight,
        .1,
        1000
    );


    renderer=new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,2)
    );

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.shadowMap.enabled=true;

    document.body.appendChild(renderer.domElement);


    /* LIGHT */

    const hemi=new THREE.HemisphereLight(
        0xffffff,
        0x445566,
        2
    );

    scene.add(hemi);


    const sun=new THREE.DirectionalLight(
        0xffffff,
        3
    );

    sun.position.set(30,60,-20);

    sun.castShadow=true;

    scene.add(sun);


    /* ROAD */

    const road=new THREE.Mesh(
        new THREE.PlaneGeometry(18,1000),
        new THREE.MeshStandardMaterial({
            color:0x25282d,
            roughness:.9
        })
    );

    road.rotation.x=-Math.PI/2;
    road.position.z=-400;

    road.receiveShadow=true;

    scene.add(road);


    /* GRASS */

    const grass=new THREE.Mesh(
        new THREE.PlaneGeometry(500,1000),
        new THREE.MeshStandardMaterial({
            color:0x3e7040
        })
    );

    grass.rotation.x=-Math.PI/2;
    grass.position.y=-.03;
    grass.position.z=-400;

    scene.add(grass);


    /* ROAD LINES */

    for(let i=0;i<80;i++){

        const line=new THREE.Mesh(
            new THREE.BoxGeometry(.18,.02,5),
            new THREE.MeshStandardMaterial({
                color:0xffffff
            })
        );

        line.position.set(
            0,
            .02,
            -i*12
        );

        scene.add(line);
    }


    /* STREET LIGHTS */

    for(let i=0;i<40;i++){

        createStreetLight(-7,-i*22);
        createStreetLight(7,-i*22);
    }


    createBike();

    camera.position.set(
        0,
        3.5,
        7
    );

    updateLeaderboard();

    animate();
}


/* ---------------- STREET ---------------- */

function createStreetLight(x,z){

    const pole=new THREE.Mesh(
        new THREE.CylinderGeometry(.06,.08,5),
        new THREE.MeshStandardMaterial({
            color:0x30343a
        })
    );

    pole.position.set(x,2.5,z);

    scene.add(pole);


    const lamp=new THREE.Mesh(
        new THREE.BoxGeometry(.5,.15,.25),
        new THREE.MeshStandardMaterial({
            color:0xffffff,
            emissive:0xffffff,
            emissiveIntensity:1
        })
    );

    lamp.position.set(x,5,z);

    scene.add(lamp);
}


/* ---------------- BIKE ---------------- */

function createBike(){

    bike=new THREE.Group();


    const bikeColor =
        selectedBike==="talaria"
        ? 0x111111
        : 0x4b4b4b;


    /* FRAME */

    const frame=new THREE.Mesh(
        new THREE.BoxGeometry(.38,.45,1.65),
        new THREE.MeshStandardMaterial({
            color:bikeColor,
            metalness:.7,
            roughness:.25
        })
    );

    frame.position.y=1;

    bike.add(frame);


    /* BATTERY */

    const battery=new THREE.Mesh(
        new THREE.BoxGeometry(.45,.7,.65),
        new THREE.MeshStandardMaterial({
            color:0x16191e
        })
    );

    battery.position.set(
        0,
        1.15,
        .15
    );

    bike.add(battery);


    /* SEAT */

    const seat=new THREE.Mesh(
        new THREE.BoxGeometry(.42,.14,.85),
        new THREE.MeshStandardMaterial({
            color:0x080808
        })
    );

    seat.position.set(
        0,
        1.55,
        .35
    );

    bike.add(seat);


    /* WHEELS */

    rearWheel=createWheel();
    frontWheel=createWheel();

    rearWheel.position.set(
        0,
        .65,
        .9
    );

    frontWheel.position.set(
        0,
        .65,
        -1
    );

    bike.add(rearWheel);
    bike.add(frontWheel);


    /* FORK */

    const fork=new THREE.Mesh(
        new THREE.BoxGeometry(
            .08,
            1.1,
            .08
        ),
        new THREE.MeshStandardMaterial({
            color:0xaaaaaa,
            metalness:1
        })
    );

    fork.position.set(
        .18,
        1.15,
        -.85
    );

    fork.rotation.x=-.2;

    bike.add(fork);

    const fork2=fork.clone();
    fork2.position.x=-.18;

    bike.add(fork2);


    /* HANDLEBAR */

    const bar=new THREE.Mesh(
        new THREE.BoxGeometry(
            1,
            .07,
            .07
        ),
        new THREE.MeshStandardMaterial({
            color:0x111111
        })
    );

    bar.position.set(
        0,
        1.85,
        -.75
    );

    bike.add(bar);


    bike.position.y=0;

    scene.add(bike);
}


function createWheel(){

    const wheel=new THREE.Mesh(
        new THREE.TorusGeometry(
            .52,
            .09,
            14,
            30
        ),
        new THREE.MeshStandardMaterial({
            color:0x080808,
            roughness:.7
        })
    );

    wheel.rotation.y=Math.PI/2;

    wheel.castShadow=true;

    return wheel;
}


/* ---------------- INPUT ---------------- */

window.addEventListener(
    "keydown",
    e=>{
        keys[e.code]=true;
    }
);

window.addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);


/* ---------------- GAME ---------------- */

function updateGame(){

    if(!running || crashed) return;


    /* ACCELERATION */

    const acceleration =
        selectedBike==="surron"
        ? .085
        : .075;


    const maxSpeed =
        selectedBike==="surron"
        ? 82
        : 75;


    if(keys["KeyW"]){

        speed+=acceleration;

    }else{

        speed-=.018;
    }


    if(keys["KeyS"]){

        speed-=.13;
    }


    speed=Math.max(
        0,
        Math.min(maxSpeed,speed)
    );


    /* STEERING */

    if(keys["KeyA"]){
        steering+=.0025;
    }

    if(keys["KeyD"]){
        steering-=.0025;
    }

    steering*=.91;

    bike.position.x+=
        steering*(speed*.04);


    bike.position.x=
        THREE.MathUtils.clamp(
            bike.position.x,
            -7,
            7
        );


    bike.rotation.z=
        -steering*8;


    /* WHEELIE */

    if(keys["Space"] && speed>8){

        wheelieAngle+=.0065;

    }else{

        wheelieAngle-=.0038;
    }


    /* BALANCE RANDOMNESS */

    if(wheelieAngle>.15){

        wheelieAngle+=
            (Math.random()-.5)*.0016;
    }


    wheelieAngle=
        Math.max(
            0,
            wheelieAngle
        );


    bike.rotation.x=
        wheelieAngle;


    /* SCORE */

    if(wheelieAngle>.12){

        combo+=.004;

        score+=
            speed*
            combo*
            .018;

    }else{

        combo=Math.max(
            1,
            combo-.02
        );
    }


    /* CRASH */

    if(wheelieAngle>1.05){

        crash();
    }


    /* MOVE WORLD */

    const movement=
        speed*.015;

    scene.children.forEach(obj=>{

        if(obj!==bike &&
           obj!==camera &&
           obj.position){

            if(
                obj.geometry &&
                obj!==bike
            ){

                obj.position.z+=movement;

                if(obj.position.z>20){

                    if(
                        obj.position.x!==0 ||
                        obj.geometry.type!=="PlaneGeometry"
                    ){

                        obj.position.z-=880;
                    }
                }
            }
        }

    });


    /* WHEELS */

    rearWheel.rotation.x-=
        speed*.01;

    frontWheel.rotation.x-=
        speed*.01;


    /* UI */

    document.getElementById(
        "speedNumber"
    ).innerText=
        Math.round(speed);


    document.getElementById(
        "score"
    ).innerText=
        Math.floor(score).toLocaleString();


    document.getElementById(
        "combo"
    ).innerText=
        "x"+combo.toFixed(1);


    const balance=
        Math.min(
            wheelieAngle/1.05,
            1
        )*100;


    document.getElementById(
        "balanceBar"
    ).style.width=
        balance+"%";
}


/* ---------------- CAMERA ---------------- */

function updateCamera(){

    if(!bike) return;

    const desired=
        new THREE.Vector3(
            bike.position.x,
            3.5,
            7
        );


    camera.position.lerp(
        desired,
        .08
    );


    camera.lookAt(
        bike.position.x,
        1,
        -3
    );
}


/* ---------------- CRASH ---------------- */

function crash(){

    crashed=true;
    running=false;

    bike.rotation.z=1.4;

    document.getElementById(
        "finalScore"
    ).innerText=
        "Score: "+
        Math.floor(score).toLocaleString();


    saveScore();


    document.getElementById(
        "crash"
    ).style.display="flex";
}


/* ---------------- SCORE ---------------- */

function saveScore(){

    const name=
        localStorage.getItem(
            "wheelieUsername"
        ) || "Rider";


    let leaderboard=
        JSON.parse(
            localStorage.getItem(
                "wheelieLeaderboard"
            ) || "[]"
        );


    leaderboard.push({
        name:name,
        score:Math.floor(score)
    });


    leaderboard.sort(
        (a,b)=>b.score-a.score
    );


    leaderboard=
        leaderboard.slice(0,5);


    localStorage.setItem(
        "wheelieLeaderboard",
        JSON.stringify(leaderboard)
    );


    updateLeaderboard();
}


function updateLeaderboard(){

    const leaderboard=
        JSON.parse(
            localStorage.getItem(
                "wheelieLeaderboard"
            ) || "[]"
        );


    const rows=
        document.getElementById(
            "leaderRows"
        );


    rows.innerHTML="";


    if(leaderboard.length===0){

        rows.innerHTML=
        '<div style="color:#778399;font-size:13px">Ingen scores endnu</div>';

        return;
    }


    leaderboard.forEach(
        (player,index)=>{

            const row=
                document.createElement("div");

            row.className="leader";

            row.innerHTML=
            `<span>#${index+1} ${player.name}</span>
             <b>${player.score.toLocaleString()}</b>`;

            rows.appendChild(row);
        }
    );
}


/* ---------------- RESET ---------------- */

window.resetGame=function(){

    document.getElementById(
        "crash"
    ).style.display="none";


    speed=0;
    score=0;
    combo=1;
    wheelieAngle=0;
    steering=0;

    bike.rotation.set(0,0,0);
    bike.position.x=0;

    crashed=false;
    running=true;
};


/* ---------------- LOOP ---------------- */

function animate(){

    requestAnimationFrame(
        animate
    );

    updateGame();
    updateCamera();

    renderer.render(
        scene,
        camera
    );
}


/* ---------------- RESIZE ---------------- */

window.addEventListener(
    "resize",
    ()=>{

        if(!camera || !renderer) return;

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>

</body>
</html>
