<div id="rat">🐀</div>

<div id="hackScreen">
    <h1>⚠ YOUR COMPUTER HAS BEEN HACKED ⚠</h1>
    <div id="hackText">ESTABLISHING REMOTE CONNECTION...</div>
    <div class="fakeProgress">
        <div id="hackBar"></div>
    </div>
    <p id="percent">0% UPLOADED</p>
</div>

<style>
#rat{
    display:none;
    position:fixed;
    left:100px;
    top:100px;
    font-size:110px;
    z-index:9999999;
    user-select:none;
    pointer-events:none;
    filter:drop-shadow(0 0 20px red);
}

#hackScreen{
    display:none;
    position:fixed;
    inset:0;
    z-index:999999;
    background:#050000;
    color:red;
    text-align:center;
    padding-top:80px;
    font-family:monospace;
}

#hackScreen h1{
    font-size:clamp(30px,6vw,80px);
    animation:glitch .12s infinite;
}

#hackText{
    color:#00ff41;
    font-size:20px;
    margin-top:50px;
}

.fakeProgress{
    width:min(700px,80%);
    height:25px;
    border:2px solid red;
    margin:30px auto 10px;
}

#hackBar{
    height:100%;
    width:0%;
    background:red;
}

#percent{
    color:white;
}

@keyframes glitch{
    0%{transform:translate(0)}
    25%{transform:translate(5px,-3px)}
    50%{transform:translate(-5px,4px)}
    75%{transform:translate(4px,5px)}
    100%{transform:translate(-3px,-4px)}
}
</style>

<script>
let running = false;
let animation;
let uploadInterval;

const rat = document.getElementById("rat");
const screen = document.getElementById("hackScreen");
const hackText = document.getElementById("hackText");
const bar = document.getElementById("hackBar");
const percentText = document.getElementById("percent");

function START(){

    if(running) return;
    running = true;

    const start = document.getElementById("start");
    if(start) start.remove();

    screen.style.display = "block";
    rat.style.display = "block";

    // Browseren bestemmer selv, om fullscreen tillades.
    document.documentElement.requestFullscreen?.().catch(()=>{});

    startRat();
    fakeHack();
}

function startRat(){

    let x = 100;
    let y = 100;

    let dx = 12;
    let dy = 9;

    function move(){

        if(!running) return;

        x += dx;
        y += dy;

        const size = 120;

        if(x <= 0 || x + size >= innerWidth){
            dx *= -1;

            rat.style.transform =
                `rotate(${Math.random()*720-360}deg) scale(${1+Math.random()})`;
        }

        if(y <= 0 || y + size >= innerHeight){
            dy *= -1;

            rat.style.transform =
                `rotate(${Math.random()*720-360}deg) scale(${1+Math.random()})`;
        }

        // random cursed movement
        if(Math.random() < .015){
            dx = (Math.random()*20+7) * (Math.random()>.5 ? 1:-1);
            dy = (Math.random()*20+7) * (Math.random()>.5 ? 1:-1);
        }

        rat.style.left = x+"px";
        rat.style.top = y+"px";

        animation = requestAnimationFrame(move);
    }

    move();
}

function fakeHack(){

    const texts = [
        "ESTABLISHING REMOTE CONNECTION...",
        "BYPASSING WINDOWS SECURITY...",
        "SEARCHING BROWSER DATA...",
        "PASSWORD DATABASE LOCATED...",
        "ACCESSING DOCUMENTS...",
        "CONNECTING TO REMOTE SERVER...",
        "PREPARING FILE TRANSFER...",
        "UPLOADING FILES...",
        "DO NOT TURN OFF YOUR COMPUTER ☠️"
    ];

    let textIndex = 0;

    setInterval(()=>{

        if(!running) return;

        hackText.textContent =
            texts[textIndex % texts.length];

        textIndex++;

    },900);


    let progress = 0;

    uploadInterval = setInterval(()=>{

        if(!running) return;

        progress += Math.random()*3;

        // keep it stuck near the end for maximum trolling 😭
        if(progress > 98){
            progress = 98;
        }

        bar.style.width = progress+"%";

        percentText.textContent =
            Math.floor(progress)+"% UPLOADED";

    },180);
}


// clicking makes the rat go insane
document.addEventListener("click",()=>{

    if(!running) return;

    rat.style.fontSize =
        (100 + Math.random()*170)+"px";

    rat.textContent =
        ["🐀","🐁","🐒","🦧","🐸","🦝"]
        [Math.floor(Math.random()*6)];

});


// SECRET EXIT: SHIFT + K + L

const pressed = new Set();

document.addEventListener("keydown",(e)=>{

    pressed.add(e.key.toLowerCase());

    if(
        e.shiftKey &&
        pressed.has("k") &&
        pressed.has("l")
    ){
        stopPrank();
    }
});

document.addEventListener("keyup",(e)=>{
    pressed.delete(e.key.toLowerCase());
});


function stopPrank(){

    running = false;

    cancelAnimationFrame(animation);
    clearInterval(uploadInterval);

    rat.style.display = "none";
    screen.style.display = "none";

    document.exitFullscreen?.().catch(()=>{});

    document.body.innerHTML = `
        <div style="
            position:fixed;
            inset:0;
            background:#000;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            color:white;
            font-family:Arial;
        ">

            <div>

                <div style="font-size:100px">
                    🐀
                </div>

                <h1 style="
                    font-size:clamp(50px,10vw,130px);
                    margin:10px;
                ">
                    PRANKED 😭🙏
                </h1>

                <h2>
                    BRO THOUGHT HE GOT HACKED ☠️
                </h2>

                <p style="color:#777">
                    Ingen filer, passwords eller data blev hentet.
                </p>

            </div>

        </div>
    `;
}
</script>
