<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA Turnering</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#1a1a1a;
    color:white;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

h1,h2{
    text-align:center;
}

button{
    padding:12px 20px;
    font-size:18px;
    cursor:pointer;
    display:block;
    margin:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
    background:white;
    color:black;
}

th,td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

input{
    width:60px;
    text-align:center;
}

#winner{
    text-align:center;
    font-size:28px;
    color:gold;
    margin:20px;
}
</style>
</head>
<body>

<h1>🏆 FIFA Turnering</h1>

<button onclick="startTournament()">Start Turnering</button>

<div id="winner"></div>

<h2>Hold</h2>
<table>
<thead>
<tr>
<th>Spiller</th>
<th>Hold</th>
</tr>
</thead>
<tbody id="teams"></tbody>
</table>

<h2>Kampe</h2>
<table>
<thead>
<tr>
<th>Hjemme</th>
<th>Mål</th>
<th>Mål</th>
<th>Ude</th>
</tr>
</thead>
<tbody id="matches"></tbody>
</table>

<h2>Stilling</h2>
<table>
<thead>
<tr>
<th>Spiller</th>
<th>Point</th>
<th>Målscore</th>
</tr>
</thead>
<tbody id="standings"></tbody>
</table>

<script>

const players = [
"Bertel",
"Victor",
"Aron",
"Kasper",
"Mathias",
"Marcus"
];

const fifaTeams = [
"Real Madrid",
"Barcelona",
"Liverpool",
"Manchester City",
"Arsenal",
"PSG",
"Bayern München",
"Chelsea",
"Juventus",
"Inter",
"AC Milan",
"Dortmund"
];

let assignedTeams = {};
let matches = [];

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
}

function startTournament(){

    assignedTeams = {};
    matches = [];

    let teams = [...fifaTeams];
    shuffle(teams);

    players.forEach((player,index)=>{
        assignedTeams[player]=teams[index];
    });

    renderTeams();

    for(let i=0;i<players.length;i++){
        for(let j=i+1;j<players.length;j++){

            matches.push({
                home:players[i],
                away:players[j],
                homeGoals:null,
                awayGoals:null
            });

        }
    }

    shuffle(matches);

    renderMatches();
    updateTable();
}

function renderTeams(){

    let html="";

    players.forEach(player=>{

        html+=`
        <tr>
            <td>${player}</td>
            <td>${assignedTeams[player]}</td>
        </tr>
        `;

    });

    document.getElementById("teams").innerHTML=html;
}

function renderMatches(){

    let html="";

    matches.forEach((match,index)=>{

        html+=`
        <tr>
            <td>${match.home} (${assignedTeams[match.home]})</td>

            <td>
            <input
            type="number"
            min="0"
            onchange="setScore(${index},'home',this.value)">
            </td>

            <td>
            <input
            type="number"
            min="0"
            onchange="setScore(${index},'away',this.value)">
            </td>

            <td>${match.away} (${assignedTeams[match.away]})</td>
        </tr>
        `;

    });

    document.getElementById("matches").innerHTML=html;
}

function setScore(index,side,value){

    value=parseInt(value);

    if(side==="home"){
        matches[index].homeGoals=value;
    }else{
        matches[index].awayGoals=value;
    }

    updateTable();
}

function updateTable(){

    let table={};

    players.forEach(player=>{

        table[player]={
            points:0,
            gd:0
        };

    });

    matches.forEach(match=>{

        if(
            match.homeGoals !== null &&
            match.awayGoals !== null
        ){

            table[match.home].gd +=
            match.homeGoals-match.awayGoals;

            table[match.away].gd +=
            match.awayGoals-match.homeGoals;

            if(match.homeGoals>match.awayGoals){

                table[match.home].points+=3;

            }else if(match.awayGoals>match.homeGoals){

                table[match.away].points+=3;

            }else{

                table[match.home].points+=1;
                table[match.away].points+=1;

            }

        }

    });

    let sorted=Object.entries(table).sort((a,b)=>{

        if(b[1].points!==a[1].points){
            return b[1].points-a[1].points;
        }

        return b[1].gd-a[1].gd;

    });

    let html="";

    sorted.forEach(([player,data])=>{

        html+=`
        <tr>
            <td>${player}</td>
            <td>${data.points}</td>
            <td>${data.gd}</td>
        </tr>
        `;

    });

    document.getElementById("standings").innerHTML=html;

    if(sorted.length>0){

        document.getElementById("winner").innerHTML=
        "👑 Nummer 1: " +
        sorted[0][0] +
        " (" +
        sorted[0][1].points +
        " point)";
    }
}

</script>

</body>
</html>
