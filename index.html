<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA Tournament</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e1b4b,#6d28d9);
color:white;
padding:20px;
min-height:100vh;
}

.container{
max-width:1400px;
margin:auto;
}

h1{
font-size:3rem;
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
opacity:.8;
margin-bottom:25px;
}

.glass{
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:20px;
margin-bottom:20px;
}

button{
background:#22c55e;
border:none;
padding:15px;
border-radius:12px;
color:white;
font-weight:700;
cursor:pointer;
width:100%;
font-size:16px;
}

button:hover{
transform:scale(1.02);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.team{
display:flex;
justify-content:space-between;
padding:10px;
margin-bottom:8px;
background:rgba(255,255,255,.05);
border-radius:10px;
}

.match{
display:grid;
grid-template-columns:1fr 70px 70px 1fr;
gap:10px;
align-items:center;
padding:10px;
margin-bottom:10px;
background:rgba(255,255,255,.05);
border-radius:12px;
}

input{
width:100%;
height:40px;
border:none;
border-radius:10px;
text-align:center;
font-size:16px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
text-align:center;
}

tr:nth-child(even){
background:rgba(255,255,255,.05);
}

.gold{color:gold;font-weight:800;}
.silver{color:silver;font-weight:800;}
.bronze{color:#cd7f32;font-weight:800;}

#winner{
font-size:28px;
font-weight:800;
text-align:center;
margin-top:15px;
color:gold;
}

@media(max-width:800px){
.grid{
grid-template-columns:1fr;
}
.match{
grid-template-columns:1fr 60px 60px 1fr;
}
}
</style>
</head>
<body>

<div class="container">

<h1>🏆 FIFA TOURNERING</h1>
<div class="subtitle">Bertel • Victor • Aron • Kasper • Mathias • Marcus</div>

<div class="glass">
<button onclick="startTournament()">🎮 Start Ny Turnering</button>
<div id="winner"></div>
</div>

<div class="grid">

<div class="glass">
<h2>⚽ Hold</h2>
<div id="teams"></div>
</div>

<div class="glass">
<h2>🏅 Stilling</h2>

<table>
<thead>
<tr>
<th>#</th>
<th>Spiller</th>
<th>Point</th>
<th>MS</th>
</tr>
</thead>
<tbody id="standings"></tbody>
</table>

</div>

</div>

<div class="glass">
<h2>📅 Kampe</h2>
<div id="matches"></div>
</div>

</div>

<script>

const players=[
"Bertel",
"Victor",
"Aron",
"Kasper",
"Mathias",
"Marcus"
];

const teams=[
"Real Madrid",
"Barcelona",
"Liverpool",
"Arsenal",
"PSG",
"Bayern München",
"Manchester City",
"Chelsea",
"Inter",
"Juventus",
"AC Milan",
"Dortmund"
];

let assignedTeams={};
let matches=[];

function shuffle(arr){
for(let i=arr.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}
}

function save(){
localStorage.setItem("fifaData",
JSON.stringify({
assignedTeams,
matches
}));
}

function load(){
const data=localStorage.getItem("fifaData");

if(!data) return;

const parsed=JSON.parse(data);

assignedTeams=parsed.assignedTeams;
matches=parsed.matches;

renderTeams();
renderMatches();
updateTable();
}

function startTournament(){

assignedTeams={};
matches=[];

const randomTeams=[...teams];
shuffle(randomTeams);

players.forEach((player,index)=>{
assignedTeams[player]=randomTeams[index];
});

for(let i=0;i<players.length;i++){
for(let j=i+1;j<players.length;j++){

matches.push({
home:players[i],
away:players[j],
homeGoals:"",
awayGoals:""
});

}
}

shuffle(matches);

renderTeams();
renderMatches();
updateTable();
save();
}

function renderTeams(){

let html="";

players.forEach(player=>{

html+=`
<div class="team">
<span>${player}</span>
<strong>${assignedTeams[player]}</strong>
</div>
`;

});

document.getElementById("teams").innerHTML=html;
}

function renderMatches(){

let html="";

matches.forEach((m,index)=>{

html+=`
<div class="match">

<div>
${m.home}
<br>
<small>${assignedTeams[m.home]}</small>
</div>

<input
type="number"
min="0"
value="${m.homeGoals}"
onchange="setScore(${index},'home',this.value)"
>

<input
type="number"
min="0"
value="${m.awayGoals}"
onchange="setScore(${index},'away',this.value)"
>

<div style="text-align:right">
${m.away}
<br>
<small>${assignedTeams[m.away]}</small>
</div>

</div>
`;

});

document.getElementById("matches").innerHTML=html;
}

function setScore(index,side,value){

matches[index][side+"Goals"]=value;

updateTable();
save();
}

function updateTable(){

let table={};

players.forEach(p=>{
table[p]={
points:0,
gd:0
};
});

matches.forEach(match=>{

if(match.homeGoals!=="" && match.awayGoals!==""){

let h=parseInt(match.homeGoals);
let a=parseInt(match.awayGoals);

table[match.home].gd+=h-a;
table[match.away].gd+=a-h;

if(h>a){
table[match.home].points+=3;
}
else if(a>h){
table[match.away].points+=3;
}
else{
table[match.home].points+=1;
table[match.away].points+=1;
}

}

});

const sorted=Object.entries(table).sort((a,b)=>{

if(b[1].points!==a[1].points)
return b[1].points-a[1].points;

return b[1].gd-a[1].gd;

});

let html="";

sorted.forEach(([player,data],index)=>{

let cls="";

if(index===0) cls="gold";
if(index===1) cls="silver";
if(index===2) cls="bronze";

html+=`
<tr class="${cls}">
<td>${index+1}</td>
<td>${player}</td>
<td>${data.points}</td>
<td>${data.gd}</td>
</tr>
`;

});

document.getElementById("standings").innerHTML=html;

if(sorted.length){

document.getElementById("winner").innerHTML=
"👑 Førsteplads: "+sorted[0][0];

}

}

load();

</script>

</body>
</html>
