<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading...</title>

<style>
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#050505;color:white;
}

#start{
  position:fixed;inset:0;z-index:99999;
  display:flex;align-items:center;justify-content:center;
  background:#050505;
}

.startBox{
  text-align:center;
  padding:35px;
  border:1px solid #333;
  border-radius:20px;
  background:#111;
  width:min(430px,90%);
}

button{
  border:0;
  padding:16px 28px;
  border-radius:12px;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.window{
  position:absolute;
  width:300px;
  min-height:130px;
  border:3px solid #111;
  background:#eee;
  color:#111;
  box-shadow:10px 10px 0 rgba(0,0,0,.5);
  z-index:10;
}

.title{
  background:#1267d6;
  color:white;
  padding:7px;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
}

.content{
  padding:15px;
  font-weight:bold;
  text-align:center;
}

.fakeClose{
  background:#e22;
  padding:1px 7px;
}

#warning{
  position:fixed;
  top:15px;left:50%;
  transform:translateX(-50%);
  font-family:monospace;
  font-size:18px;
  color:#0f0;
  z-index:9000;
  text-shadow:0 0 10px #0f0;
}

#counter{
  position:fixed;
  bottom:15px;
  right:15px;
  z-index:9000;
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
  padding:12px;
  font-family:monospace;
}

#final{
  display:none;
  position:fixed;
  inset:0;
  z-index:999999;
  background:#000;
  align-items:center;
  justify-content:center;
  text-align:center;
}

#final h1{
  font-size:clamp(45px,10vw,130px);
  margin:0;
  animation:rainbow .4s infinite;
}

#final p{
  font-size:20px;
}

@keyframes rainbow{
  0%{color:red}
  20%{color:yellow}
  40%{color:lime}
  60%{color:cyan}
  80%{color:#f0f}
  100%{color:red}
}

.shake{
  animation:shake .08s infinite;
}

@keyframes shake{
  0%{transform:translate(0,0)}
  25%{transform:translate(7px,-5px)}
  50%{transform:translate(-6px,6px)}
  75%{transform:translate(5px,4px)}
  100%{transform:translate(-4px,-5px)}
}

.emoji{
  position:absolute;
  font-size:70px;
  z-index:5;
  user-select:none;
}
</style>
</head>

<body>

<div id="start">
  <div class="startBox">
    <h1>⚠️ VIDEO READY</h1>
    <p>Tryk for at fortsætte</p>
    <button onclick="START()">AFSPIL</button>
  </div>
</div>

<div id="warning"></div>

<div id="counter">
  WINDOWS: <span id="count">0</span>
</div>

<div id="final">
  <div>
    <h1>PRANKED 😭🙏</h1>
    <p>Bradar troede computeren var cooked ☠️</p>
    <p style="color:#777;font-size:14px">
      Ingen filer eller oplysninger blev hentet.
    </p>
  </div>
</div>

<script>

let started=false;
let windows=[];
let count=0;

const messages=[
 "SYSTEM32 HAS LEFT THE CHAT ☠️",
 "VIRUS DETECTED 😭",
 "Deleting homework...",
 "Downloading 847 viruses...",
 "Bro what did you click 💀",
 "CPU IS COOKED 🔥",
 "Windows Defender gave up.",
 "Sending browser history to mom...",
 "Robux balance detected: 3 💔",
 "Skill issue detected.",
 "YOUR PC IS MINE 😈",
 "Uploading embarrassing screenshots...",
 "FBI CONNECTION ESTABLISHED",
 "ERROR ERROR ERROR ERROR",
 "Bro close the tab 😭🙏",
 "Too late lil bro ☠️"
];

const emojis=[
 "😭","☠️","🙏","💀","🔥","💔","🤡","😈"
];

function START(){

 if(started)return;
 started=true;

 document.getElementById("start").remove();

 document.documentElement.requestFullscreen?.().catch(()=>{});

 document.body.classList.add("shake");

 createWindows();

 chaosBackground();

 warningText();

 setTimeout(finalScreen,15000);
}

function createWindows(){

 let interval=setInterval(()=>{

   if(count>=35){
      clearInterval(interval);
      return;
   }

   createWindow();
   count++;

   document.getElementById("count").textContent=count;

 },250);
}

function createWindow(){

 const win=document.createElement("div");
 win.className="window";

 win.style.left=
 Math.random()*(innerWidth-300)+"px";

 win.style.top=
 Math.random()*(innerHeight-150)+"px";

 win.innerHTML=`
   <div class="title">
      SYSTEM ERROR
      <span class="fakeClose">X</span>
   </div>

   <div class="content">
      ${messages[Math.floor(Math.random()*messages.length)]}
      <br><br>
      <button>OK</button>
   </div>
 `;

 document.body.appendChild(win);

 let dx=(Math.random()*10)+4;
 let dy=(Math.random()*10)+4;

 if(Math.random()>.5)dx=-dx;
 if(Math.random()>.5)dy=-dy;

 let x=parseFloat(win.style.left);
 let y=parseFloat(win.style.top);

 function move(){

   if(!document.body.contains(win))return;

   x+=dx;
   y+=dy;

   if(x<=0 || x+300>=innerWidth)
      dx*=-1;

   if(y<=0 || y+150>=innerHeight)
      dy*=-1;

   win.style.left=x+"px";
   win.style.top=y+"px";

   requestAnimationFrame(move);
 }

 move();

 win.querySelector("button").onclick=()=>{
    createWindow();
    createWindow();
    createWindow();
 };

 win.querySelector(".fakeClose").onclick=()=>{
    createWindow();
    createWindow();
 };
}

function chaosBackground(){

 setInterval(()=>{

   document.body.style.background=
   `hsl(${Math.random()*360},100%,${Math.random()*20+5}%)`;

   const e=document.createElement("div");

   e.className="emoji";

   e.textContent=
   emojis[Math.floor(Math.random()*emojis.length)];

   e.style.left=Math.random()*innerWidth+"px";
   e.style.top=Math.random()*innerHeight+"px";

   document.body.appendChild(e);

   setTimeout(()=>e.remove(),1000);

 },150);
}

function warningText(){

 const warning=document.getElementById("warning");

 const texts=[
   "INITIALIZING...",
   "ACCESSING COMPUTER...",
   "SEARCHING FILES...",
   "PASSWORDS FOUND...",
   "UPLOADING...",
   "DO NOT TURN OFF COMPUTER ☠️"
 ];

 let i=0;

 setInterval(()=>{

   warning.textContent=texts[i%texts.length];
   i++;

 },900);
}

function finalScreen(){

 document.body.classList.remove("shake");

 document.querySelectorAll(".window,.emoji")
 .forEach(x=>x.remove());

 document.getElementById("warning").remove();
 document.getElementById("counter").remove();

 document.body.style.background="#000";

 document.getElementById("final").style.display="flex";
}

</script>

</body>
</html>
