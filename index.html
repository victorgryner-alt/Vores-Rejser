<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Security</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #020402;
    color: #00ff66;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

#matrix {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: .16;
}

.container {
    position: relative;
    z-index: 2;
    width: min(900px, 92%);
    margin: 40px auto;
}

.header {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #00ff66;
    padding-bottom: 12px;
    margin-bottom: 18px;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.status {
    color: #ff3b3b;
    animation: blink 1s infinite;
}

.terminal {
    background: rgba(0, 8, 0, .92);
    border: 1px solid #00ff66;
    border-radius: 8px;
    padding: 20px;
    height: 480px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(0,255,100,.15);
}

#lineContainer {
    height: 370px;
    overflow: hidden;
}

.line {
    margin: 7px 0;
    font-size: 14px;
}

.red {
    color: #ff4242;
}

.yellow {
    color: #ffe600;
}

.progressBox {
    margin-top: 20px;
}

.progress {
    height: 14px;
    border: 1px solid #00ff66;
    width: 100%;
}

.bar {
    height: 100%;
    width: 0%;
    background: #00ff66;
    transition: width .2s;
}

.progressText {
    margin-top: 7px;
    font-size: 13px;
}

.final {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    background: black;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.final h1 {
    color: #00ff66;
    font-size: clamp(35px, 8vw, 90px);
    margin: 0;
}

.final p {
    color: white;
    font-family: Arial, sans-serif;
    font-size: 20px;
}

@keyframes blink {
    50% { opacity: .25; }
}

@media(max-width:600px) {
    .container {
        margin-top: 20px;
    }

    .terminal {
        height: 520px;
    }

    .line {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="container">

    <div class="header">
        <div class="logo">SECURE_TERMINAL v4.8.2</div>
        <div class="status">● CONNECTION ACTIVE</div>
    </div>

    <div class="terminal">

        <div id="lineContainer"></div>

        <div class="progressBox">
            <div class="progress">
                <div class="bar" id="bar"></div>
            </div>

            <div class="progressText" id="progressText">
                Initializing...
            </div>
        </div>

    </div>
</div>

<div class="final" id="final">
    <div>
        <h1>PRANKED 😭🙏</h1>
        <p>Bror troede lige hans computer var cooked 💀</p>
        <p style="color:#777;font-size:14px;">
            Ingen data blev indsamlet. Det var bare en prank.
        </p>
    </div>
</div>

<script>

// FAKE TERMINAL DATA ONLY
const messages = [
    "[SYSTEM] Establishing secure connection...",
    "[OK] Connection established.",
    "[SYSTEM] Detecting operating system...",
    "[OK] Device detected.",
    "[SYSTEM] Starting security scan...",
    "[SCAN] Searching browser database...",
    "[SCAN] Checking saved credentials...",
    "[FOUND] 7 browser sessions detected.",
    "[FOUND] 14 cached login entries.",
    "[SCAN] Checking local storage...",
    "[FOUND] Documents directory detected.",
    "[SCAN] Searching authentication tokens...",
    "[FOUND] Discord session: ***************",
    "[FOUND] Google account: ***************",
    "[FOUND] Roblox session: ***************",
    "[SYSTEM] Preparing encrypted archive...",
    "[UPLOAD] Connecting remote server...",
    "[UPLOAD] Sending package...",
    "[WARNING] Security software response detected.",
    "[BYPASS] Attempting bypass...",
    "[OK] Bypass successful.",
    "[UPLOAD] Finalizing transfer..."
];

const container = document.getElementById("lineContainer");
const bar = document.getElementById("bar");
const progressText = document.getElementById("progressText");

let index = 0;

function addLine() {

    if(index >= messages.length) {
        startUpload();
        return;
    }

    const div = document.createElement("div");
    div.className = "line";

    if(messages[index].includes("WARNING")) {
        div.classList.add("red");
    }

    if(messages[index].includes("FOUND")) {
        div.classList.add("yellow");
    }

    div.textContent = "> " + messages[index];

    container.appendChild(div);
    container.scrollTop = container.scrollHeight;

    index++;

    setTimeout(addLine, 250 + Math.random() * 450);
}

setTimeout(addLine, 800);


// FAKE UPLOAD

function startUpload() {

    let percent = 0;

    const upload = setInterval(() => {

        percent += Math.floor(Math.random() * 7) + 1;

        if(percent > 100) percent = 100;

        bar.style.width = percent + "%";
        progressText.textContent =
            "Uploading encrypted files... " + percent + "%";

        if(percent >= 100) {

            clearInterval(upload);

            progressText.textContent = "TRANSFER COMPLETE";

            setTimeout(() => {
                document.getElementById("final").style.display = "flex";
            }, 1800);
        }

    }, 180);
}


// MATRIX BACKGROUND

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);

const chars =
"01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@";

const fontSize = 14;

let columns =
Math.floor(canvas.width / fontSize);

let drops =
Array(columns).fill(1);

function drawMatrix() {

    ctx.fillStyle = "rgba(0,0,0,.08)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#00ff66";
    ctx.font = fontSize + "px monospace";

    for(let i = 0; i < drops.length; i++) {

        const char =
            chars[Math.floor(Math.random()*chars.length)];

        ctx.fillText(
            char,
            i * fontSize,
            drops[i] * fontSize
        );

        if(
            drops[i] * fontSize > canvas.height &&
            Math.random() > .975
        ) {
            drops[i] = 0;
        }

        drops[i]++;
    }
}

setInterval(drawMatrix, 40);

</script>

</body>
</html>
